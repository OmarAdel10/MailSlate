name: Labels

# pull_request_target is required so the labeler has write access to PRs
# (DEVELOPMENT_ENVIRONMENT.md §9). The job only applies labels based on
# .github/labeler.yml from the base branch; it never checks out or executes
# PR code.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Apply PR labels
    runs-on: ubuntu-latest
    steps:
      - name: Run labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: false
