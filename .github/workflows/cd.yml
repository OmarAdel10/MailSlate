name: CD

# Master-only release pipeline (DEVELOPMENT_ENVIRONMENT.md §10): releases are
# cut by tagging a commit on master (vX.Y.Z). The guard job verifies the tag
# is an ancestor of master and that pubspec.yaml's version matches the tag,
# then packages installers for all three platforms and publishes a GitHub
# Release. workflow_dispatch runs the packaging jobs from master without
# publishing a release (dry run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
              echo "Manual release runs must be dispatched from master (got ${GITHUB_REF})."
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
              echo "Tag ${GITHUB_REF_NAME} does not point at a commit on master. Aborting."
              exit 1
            fi
          fi
      - name: Verify pubspec version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | cut -d+ -f1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "pubspec=${pkg} tag=${tag}"
          if [ "${pkg}" != "${tag}" ]; then
            echo "pubspec version (${pkg}) must equal the tag (${tag}) - see DEVELOPMENT_ENVIRONMENT.md 10.2."
            exit 1
          fi

  linux:
    name: Package (Linux: deb, rpm, AppImage)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm patchelf
      - name: Install dependencies
        run: flutter pub get
      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Package
        run: fastforge package --platform linux --targets deb,rpm,appimage
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: dist/**

  windows:
    name: Package (Windows: EXE installer)
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install dependencies
        run: flutter pub get
      - name: Install fastforge
        shell: pwsh
        run: |
          dart pub global activate fastforge
          echo "$env:LOCALAPPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Package
        run: fastforge package --platform windows --targets exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: dist/**

  macos:
    name: Package (macOS: DMG)
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install appdmg
        run: npm install -g appdmg
      - name: Install dependencies
        run: flutter pub get
      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Package
        run: fastforge package --platform macos --targets dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: dist/**

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | sort
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true

  shorebird:
    name: Shorebird release (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for shorebird.yaml
        id: check
        run: |
          if [ -f shorebird.yaml ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Shorebird skipped::shorebird.yaml missing - run 'shorebird init' once (DEVELOPMENT_ENVIRONMENT.md 10)."
          fi
      - name: Set up Shorebird
        if: steps.check.outputs.enabled == 'true'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Release
        if: steps.check.outputs.enabled == 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird release ${{ matrix.platform }}
