[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/protocol",
  "crates/daemon",
  "crates/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/OmarAdel10/MailSlate"

[workspace.dependencies]
# Shared dependency versions are declared here as crates adopt them
# (ARCHITECTURE.md §3). Intentionally empty in the skeleton.
