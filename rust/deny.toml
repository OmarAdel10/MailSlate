# cargo-deny configuration — advisory, license, and source checks
# (ARCHITECTURE.md §12 supply chain; AGENTS.md §6 gates).

[advisories]
version = 2
yanked = 'warn'

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  'MIT',
  'Apache-2.0',
  'Apache-2.0 WITH LLVM-exception',
  'BSD-2-Clause',
  'BSD-3-Clause',
  'ISC',
  'Zlib',
  'MPL-2.0',
  'Unicode-3.0',
  'Unicode-DFS-2016',
  'CC0-1.0',
  'BSL-1.0',
]

# Workspace crates are unpublished application code; registry license
# requirements do not apply to them.
[licenses.private]
ignore = true

[sources]
unknown-registry = 'deny'
unknown-git = 'deny'
