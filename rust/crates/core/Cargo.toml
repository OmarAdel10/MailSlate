[package]
name = "mailslate-core"
description = "MailSlate domain and infrastructure engines: sync, mailbox, threading, search, storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
dirs = "7.0.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "zbus-secret-service-keyring-store", "apple-native-keyring-store", "windows-native-keyring-store"] }
libc = "0.2"
mailslate-protocol = { path = "../protocol", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.21"
tiny_http = "0.12"
tokio = { version = "1", features = ["io-util", "net", "time"] }
tokio-rustls = "0.26"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
