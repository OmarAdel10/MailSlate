[package]
# Underscored to match the flutter_rust_bridge template convention: cargokit
# looks up build artifacts as `lib$packageName.so` with the raw package
# name, while cargo emits files under the underscored lib name. A hyphenated
# package name therefore breaks the Linux link step silently.
name = "mailslate_bridge"
description = "flutter_rust_bridge v2 surface: the FFI API between the Flutter GUI and Rust."
version.workspace = true
# Pinned to 2021: FRB codegen formats the generated file with rustfmt
# --edition 2018 and the style edition follows the crate edition, so this
# keeps cargo fmt and the codegen staleness gate in agreement. Revisit
# when FRB supports edition-2024 rustfmt output.
edition = "2021"
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
mailslate-core = { path = "../core" }
mailslate-protocol = { path = "../protocol" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
