[package]
name = "mailslate-daemon"
description = "Headless MailSlate sync daemon: single SQLite writer, IMAP/SMTP, notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
mailslate-core = { path = "../core" }
mailslate-protocol = { path = "../protocol", features = ["tokio"] }
rusqlite = "0.40"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "io-util",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
